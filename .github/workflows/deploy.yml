name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 后端地址和 Google OAuth Client ID 都不进源码，构建期由 Vite 内联进产物。
      # Client ID 本来就是公开的（会出现在登录页里），所以放 vars 不放 secrets；不设则只能用邮箱验证码登录。
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      # 环境变量没注入时产物里会带着 localhost 兜底值——部署前抓出来，别让它上线
      - name: Fail if API_BASE was not injected
        run: |
          if grep -r "localhost:8080" dist; then
            echo "VITE_API_BASE was not injected into the build"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
