name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 后端地址和 API 密钥都不进源码，部署时注入。
      # 密钥最终会随静态产物公开（页面是公开的），放 secret 只是别让它出现在构建日志里。
      - run: |
          sed -i "s|__API_BASE__|${{ vars.API_BASE }}|g" api.js
          sed -i "s|__API_KEY__|${{ secrets.API_KEY }}|g" api.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
