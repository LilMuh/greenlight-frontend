<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreenLight — Tee Times</title>
    <!-- 页面底色在 HTML 里就有：CSS 包解析前也用页面底色，暗色系统下也不先刷一层深色画布 -->
    <style>
      html,
      body {
        margin: 0;
        background: oklch(98% 0.006 95);
      }
      html {
        color-scheme: light;
      }
    </style>
    <!-- 字体预加载：字体请求是 CORS 模式，没有 crossorigin 预加载会对不上 -->
    <link rel="preload" href="/src/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- 预渲染头部里的其他标签（悬停时，moderate）。
         三页加载期只发 GET：Search 是 health / courses / tee-times / me；
         Watch 是 courses / me / watch-configs / matches；Booking 是 courses / me / booking-tasks。
         Watch 页的 Google 登录是点击后整页跳转，加载期不向 Google 发请求；回跳处理在预渲染期间跳过（src/pages/config/main.tsx），所以仍用 prerender 而不是 prefetch。
         激活时会话变化（中途登出或换账号）由 src/prerenderGuard.ts 处理。 -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "where": { "selector_matches": ".gl-hd-tab:not([aria-current])" },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
    <!-- 入口脚本放在 head：render-blocking 只对 body 出现之前的元素生效。
         blocking="render" 由 vite.config.ts 的插件统一补，不写在源 HTML 里。 -->
    <script type="module" src="/src/pages/tee-times/main.tsx"></script>
  </head>
  <body>
    <div class="tt" id="app"><!-- rendered by src/pages/tee-times/main.tsx --></div>
  </body>
</html>
