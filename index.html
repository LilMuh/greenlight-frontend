<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreenLight — Tee Times</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- Tee-time search page: self-contained styling from the imported design.
         Mirrors config.html's approach so both pages share a look without a build step. --- */
      .tt {
        --green: oklch(58% 0.12 150);
        --green-d: oklch(50% 0.12 150);
        --green-soft: oklch(94% 0.03 150);
        --green-ink: oklch(38% 0.12 150);
        --ink: oklch(22% 0.01 95);
        --ink2: oklch(30% 0.01 95);
        --muted: oklch(48% 0.012 95);
        --muted2: oklch(60% 0.012 95);
        --line: oklch(90% 0.006 95);
        --line2: oklch(94% 0.006 95);
        --bg: oklch(98% 0.006 95);
        --low: oklch(55% 0.14 35);
        color-scheme: light;
      }
      .tt,
      .tt * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      .tt {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family: "Manrope", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .tt a {
        color: var(--green);
      }
      .tt a:hover {
        color: var(--green-d);
      }
      .tt ::-webkit-scrollbar {
        height: 6px;
        width: 6px;
      }
      .tt ::-webkit-scrollbar-thumb {
        background: oklch(85% 0.006 95);
        border-radius: 3px;
      }

      /* Header */
      .tt-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 32px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .tt-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tt-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--green);
        flex: none;
      }
      .tt-brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
      }
      .tt-brand-text strong {
        font-size: 16px;
        font-weight: 800;
      }
      .tt-brand-text small {
        font-size: 11px;
        color: var(--muted);
      }
      .tt-head-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .tt-nav {
        display: flex;
        gap: 6px;
      }
      .tt-nav a {
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 700;
        text-decoration: none;
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
        white-space: nowrap;
      }
      .tt-nav a.is-active {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .tt-lang {
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        color: var(--ink);
        font-family: inherit;
      }

      /* Toolbar: date strip + collapsible filter panel */
      .tt-toolbar {
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 10px 32px 0;
      }
      .tt-toolbar-inner {
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tt-dates {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .tt-date {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-width: 56px;
        padding: 8px 6px;
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        border: 1px solid var(--line);
        flex: none;
      }
      .tt-date.is-active {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }
      .tt-date-top {
        font-size: 11px;
        color: var(--muted);
      }
      .tt-date.is-active .tt-date-top {
        color: #fff;
        opacity: 0.85;
      }
      .tt-date-num {
        font-size: 17px;
        font-weight: 700;
        line-height: 1.1;
      }
      /* Filter row: the "Filters" toggle, a summary of what's active, result count */
      .tt-filter-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        padding-bottom: 10px;
      }
      .tt-filter-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .tt-filter-btn.is-open {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .tt-filter-badge {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 800;
        background: var(--green);
        color: #fff;
      }
      .tt-filter-btn.is-open .tt-filter-badge {
        background: #fff;
        color: var(--ink);
      }
      .tt-caret {
        transition: transform 0.18s ease;
      }
      .tt-filter-btn.is-open .tt-caret {
        transform: rotate(180deg);
      }
      .tt-summary {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        min-width: 0;
      }
      .tt-summary-chip {
        padding: 5px 11px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: var(--green-soft);
        color: var(--green-ink);
        border: 1px solid var(--green);
        white-space: nowrap;
      }
      .tt-count {
        margin-left: auto;
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
      }

      /* Filter panel: collapsed by default, expands under the filter row */
      .tt-panel {
        border-top: 1px solid var(--line2);
        padding: 18px 0 20px;
        display: grid;
        gap: 22px 32px;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      }
      .tt-section {
        display: flex;
        flex-direction: column;
        gap: 9px;
        min-width: 0;
      }
      .tt-section-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .tt-courses {
        display: flex;
        flex-direction: column;
      }
      .tt-sorts {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      /* Sort reuses the price chip, squared off and full-width in its column */
      .tt-sorts .tt-chip-btn {
        width: 100%;
        text-align: left;
        border-radius: 8px;
        padding: 8px 14px;
      }
      .tt-panel-actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        border-top: 1px solid var(--line2);
        padding-top: 14px;
      }
      .tt-btn-reset,
      .tt-btn-done {
        padding: 9px 18px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .tt-btn-reset {
        background: #fff;
        color: var(--ink2);
        border: 1px solid var(--line);
      }
      .tt-btn-done {
        padding: 9px 22px;
        background: var(--green);
        color: #fff;
        border: 1px solid var(--green);
      }

      /* Body layout: results run full width now that filters live in the toolbar */
      .tt-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 24px 32px 48px;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
      }
      .tt-course {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 0;
        cursor: pointer;
      }
      .tt-box {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1.5px solid oklch(80% 0.006 95);
        background: #fff;
        flex: none;
        position: relative;
      }
      .tt-course.is-on .tt-box {
        border-color: var(--green);
        background: var(--green);
      }
      .tt-box::after {
        content: "✓";
        color: #fff;
        font-size: 11px;
        position: absolute;
        top: -1px;
        left: 1.5px;
        display: none;
      }
      .tt-course.is-on .tt-box::after {
        display: block;
      }
      .tt-course-name {
        font-size: 13px;
        color: var(--muted2);
      }
      .tt-course.is-on .tt-course-name {
        color: var(--ink);
      }
      .tt-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tt-chip-btn {
        padding: 6px 14px;
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--line);
        font-family: inherit;
      }
      .tt-chip-btn.is-active {
        background: var(--green-soft);
        color: var(--green-ink);
        font-weight: 600;
        border-color: var(--green);
      }
      /* Main results */
      .tt-cards {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .tt-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .tt-card-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      /* 照片跟着视口缩，窄屏不再占掉半行 */
      .tt-photo {
        width: clamp(52px, 14vw, 96px);
        height: clamp(52px, 14vw, 96px);
        flex: none;
        border-radius: 10px;
        background: repeating-linear-gradient(
          45deg,
          oklch(95% 0.006 95),
          oklch(95% 0.006 95) 8px,
          oklch(92% 0.006 95) 8px,
          oklch(92% 0.006 95) 16px
        );
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
      }
      .tt-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .tt-card-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .tt-card-name {
        font-size: 16px;
        font-weight: 700;
      }
      /* 球场名下面的两行副信息（Google Maps 数据）。任一为空时 JS 不渲染，
         .tt-card-info 的 gap 自动收拢，不会留下空隙 */
      .tt-card-rating {
        font-size: 12px;
        color: oklch(52% 0.012 95);
      }
      /* 地址已经在 JS 里截成「街道 + 城市」两段，仍可能超宽（长街名），再兜一层
         省略号。能生效是因为 .tt-card-info 上有 min-width: 0 */
      .tt-card-address {
        font-size: 12px;
        color: oklch(52% 0.012 95);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tt-book {
        flex: none;
        padding: 8px 20px;
        border-radius: 8px;
        border: none;
        background: var(--green);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
      }
      .tt-tees {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-top: 4px;
      }
      .tt-tee {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 14px;
        border-radius: 9px;
        border: 1.5px solid var(--line);
        background: #fff;
        cursor: pointer;
        flex: none;
        min-width: 76px;
      }
      .tt-tee.is-on {
        border-color: var(--green);
        background: var(--green-soft);
      }
      .tt-tee-time {
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .tt-tee-price {
        font-size: 12.5px;
        color: var(--muted);
      }
      .tt-tee-slots {
        font-size: 10.5px;
        color: oklch(55% 0.012 95);
      }
      .tt-tee-slots.is-low {
        color: var(--low);
      }
      .tt-empty {
        padding: 60px 20px;
        text-align: center;
        color: oklch(52% 0.012 95);
        font-size: 14px;
        background: #fff;
        border: 1px dashed oklch(88% 0.006 95);
        border-radius: 12px;
      }

      /* Toast */
      .tt-toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 11px 22px;
        border-radius: 9px;
        font-size: 13px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        z-index: 50;
      }

      @media (max-width: 860px) {
        .tt-header,
        .tt-toolbar,
        .tt-body {
          padding-left: 16px;
          padding-right: 16px;
        }
        /* 数量文字在窄屏会被 chips 挤到下一行，靠右贴边不好看 */
        .tt-count {
          margin-left: 0;
        }
      }

      /* 手机宽度：地址只留街道那段，城市名让位给球场名 */
      @media (max-width: 560px) {
        .tt-addr-city {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="tt" id="app"><!-- rendered by main.js --></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
