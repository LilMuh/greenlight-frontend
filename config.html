<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreenLight — Watch Alerts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- Watch Alerts page: self-contained styling from the imported design.
         Kept separate from styles.css so the minimal tee-times page is untouched. --- */
      .wa {
        --green: oklch(58% 0.12 150);
        --green-d: oklch(50% 0.12 150);
        --green-ink: oklch(40% 0.12 150);
        --ink: oklch(22% 0.01 95);
        --muted: oklch(48% 0.012 95);
        --muted2: oklch(60% 0.012 95);
        --line: oklch(90% 0.006 95);
        --line2: oklch(94% 0.006 95);
        --bg: oklch(98% 0.006 95);
        --chip: oklch(96% 0.006 95);
        --danger: oklch(50% 0.14 30);
        --danger-line: oklch(90% 0.14 30);
        color-scheme: light;
      }
      .wa,
      .wa * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      .wa {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family: "Manrope", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wa a {
        color: var(--green);
      }
      .wa a:hover {
        color: var(--green-d);
      }
      .wa input[type="date"],
      .wa input[type="time"] {
        font-family: inherit;
      }
      .wa input[type="range"] {
        accent-color: var(--green);
      }

      /* Header */
      .wa-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 32px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .wa-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .wa-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--green);
        flex: none;
      }
      .wa-brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
      }
      .wa-brand-text strong {
        font-size: 16px;
        font-weight: 800;
      }
      .wa-brand-text small {
        font-size: 11px;
        color: var(--muted);
      }
      .wa-head-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .wa-nav {
        display: flex;
        gap: 6px;
      }
      .wa-nav a {
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 700;
        text-decoration: none;
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
        white-space: nowrap;
      }
      .wa-nav a.is-active {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .wa-lang {
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        color: var(--ink);
        font-family: inherit;
      }

      /* Body layout */
      .wa-body {
        flex: 1;
        display: flex;
        gap: 24px;
        padding: 24px 32px;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
      }
      .wa-form {
        width: 360px;
        flex: none;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-self: flex-start;
        /* 点 Edit 会把表单滚进视野（config.js 的 scrollToForm）。表头是 sticky 的，
           留出它的高度，否则表单标题正好停在表头底下看不见。 */
        scroll-margin-top: 86px;
      }
      .wa-form-title {
        font-size: 15px;
        font-weight: 800;
      }
      .wa-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .wa-label {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--muted);
      }

      /* Course checklist */
      .wa-course {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 0;
        cursor: pointer;
      }
      .wa-box {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1.5px solid oklch(80% 0.006 95);
        background: #fff;
        flex: none;
        position: relative;
      }
      .wa-course.is-on .wa-box {
        border-color: var(--green);
        background: var(--green);
      }
      .wa-box::after {
        content: "✓";
        color: #fff;
        font-size: 11px;
        position: absolute;
        top: -1px;
        left: 1.5px;
        display: none;
      }
      .wa-course.is-on .wa-box::after {
        display: block;
      }
      .wa-course-name {
        font-size: 13px;
        color: var(--muted2);
      }
      .wa-course.is-on .wa-course-name {
        color: var(--ink);
      }
      /* 编辑一条 watch 时球场不能改（换球场就是换成另一条 watch）。
         选中的那个照常高亮，只是整块不再像可点的东西。 */
      .wa-course.is-locked {
        cursor: default;
        opacity: 0.55;
      }
      /* 字段下面那行解释，比 .wa-label 更轻——它说明的是限制，不是标题 */
      .wa-hint {
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
        padding-top: 2px;
      }

      /* Weekday toggles — seven in a row, so they share the width evenly
         instead of taking .wa-pill's padding and wrapping onto three lines. */
      .wa-days {
        display: flex;
        gap: 4px;
      }
      .wa-day {
        flex: 1;
        min-width: 0;
        padding: 7px 0;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .wa-day.is-active {
        border-color: var(--green);
        background: var(--green);
        color: #fff;
        font-weight: 700;
      }

      /* Time window. Start and end stack vertically so both fit a phone without
         the selects being squeezed down to unreadable. */
      .wa-timerow {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .wa-timepick {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .wa-time-sel {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        font-size: 12.5px;
        color: var(--ink);
        font-family: inherit;
        background: #fff;
      }
      .wa-colon {
        font-size: 12.5px;
        color: var(--muted2);
      }
      .wa-to {
        font-size: 12px;
        color: var(--muted2);
        padding-left: 2px;
      }

      /* Pills (period + players) */
      .wa-pills {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .wa-pill {
        padding: 8px 14px;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--line);
        font-family: inherit;
      }
      .wa-pill.is-active {
        background: var(--green);
        color: #fff;
        font-weight: 600;
        border-color: var(--green);
      }
      .wa-num {
        width: 32px;
        height: 32px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .wa-num.is-active {
        border-color: var(--green);
        background: var(--green);
        color: #fff;
        font-weight: 700;
      }

      /* Price slider */
      .wa-price-head {
        display: flex;
        justify-content: space-between;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--muted);
      }
      .wa-price-val {
        color: var(--ink);
        font-weight: 800;
      }
      .wa-range {
        width: 100%;
      }

      .wa-email {
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        font-size: 13px;
        color: var(--ink);
        font-family: inherit;
        background: #fff;
      }

      /* Submit / cancel */
      .wa-actions {
        display: flex;
        gap: 10px;
      }
      .wa-submit {
        flex: 1;
        padding: 11px 0;
        border-radius: 9px;
        border: none;
        background: var(--green);
        color: #fff;
        font-size: 13.5px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
      }
      .wa-cancel {
        padding: 11px 18px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #fff;
        color: oklch(40% 0.012 95);
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }

      /* List */
      .wa-list {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .wa-count {
        font-size: 13px;
        color: var(--muted);
      }
      .wa-cards {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .wa-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .wa-card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .wa-card-head {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .wa-card-head strong {
        font-size: 14.5px;
        font-weight: 700;
      }
      .wa-card-email {
        font-size: 12px;
        color: var(--muted);
      }
      .wa-status {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        flex: none;
      }
      .wa-status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: oklch(75% 0.006 95);
      }
      .wa-status.is-on .wa-status-dot {
        background: var(--green);
      }
      .wa-status-text {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted2);
      }
      .wa-status.is-on .wa-status-text {
        color: var(--green-ink);
      }
      .wa-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .wa-chip {
        font-size: 11.5px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--chip);
        color: oklch(40% 0.012 95);
      }
      .wa-card-hits {
        display: flex;
      }
      .wa-hits {
        font-size: 12px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--chip);
        color: var(--muted2);
      }
      .wa-hits.is-hot {
        background: color-mix(in oklch, var(--green-ink) 14%, transparent);
        color: var(--green-ink);
      }
      .wa-card-actions {
        display: flex;
        gap: 8px;
        padding-top: 4px;
        border-top: 1px solid var(--line2);
        margin-top: 2px;
      }
      .wa-edit {
        padding: 7px 16px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        font-family: inherit;
      }
      .wa-delete {
        padding: 7px 16px;
        border-radius: 7px;
        border: 1px solid var(--danger-line);
        background: #fff;
        color: var(--danger);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        font-family: inherit;
      }
      .wa-empty {
        padding: 60px 20px;
        text-align: center;
        color: oklch(52% 0.012 95);
        font-size: 14px;
        background: #fff;
        border: 1px dashed oklch(88% 0.006 95);
        border-radius: 12px;
      }

      /* Toast */
      .wa-toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 11px 22px;
        border-radius: 9px;
        font-size: 13px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        z-index: 50;
      }

      @media (max-width: 860px) {
        .wa-body {
          flex-wrap: wrap;
        }
        .wa-form {
          width: 100%;
          order: 1;
        }
        .wa-list {
          order: 2;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="wa" id="app"><!-- rendered by config.js --></div>
    <script type="module" src="config.js"></script>
  </body>
</html>
